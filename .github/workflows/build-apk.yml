
name: Build Men Ahla APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract game project
        run: unzip -q Men_Ahla_Project_Build_on_Phone.zip -d .

      - name: Build APK
        run: gradle -p Men_Ahla_Android_Project assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Men-Ahla-APK
          path: Men_Ahla_Android_Project/app/build/outputs/apk/debug/app-debug.apk
